<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goel Estates Status Static</title>
    <style>
      :root {
        --scale-global: {{ scale_global | default(1.0) }};
        --scale-logo: {{ scale_logo | default(1.0) }};
        --scale-header: {{ scale_header | default(1.0) }};
        --scale-text: {{ scale_text | default(1.0) }};
        --scale-footer: {{ scale_footer | default(1.0) }};
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #071a33;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: block;
      }
      .canvas {
        position: relative;
        width: 1080px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #f7f1df;
        background:
          radial-gradient(circle at top left, rgba(200, 162, 74, 0.16), transparent 30%),
          radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.05), transparent 24%),
          linear-gradient(180deg, #081e3b 0%, #051122 100%);
      }
      .header {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 0 20px;
        z-index: 2;
      }
      .brand-logo {
        width: calc(180px * var(--scale-global) * var(--scale-logo));
        height: calc(180px * var(--scale-global) * var(--scale-logo));
        object-fit: contain;
      }
      .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 75%;
        opacity: 0.08;
        z-index: 0;
        pointer-events: none;
      }
      .content {
        flex-grow: 1;
        z-index: 2;
        padding: 0 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .property-type {
        font-size: calc(52px * var(--scale-global) * var(--scale-text));
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c8a24a;
        font-weight: 800;
      }
      .headline {
        margin-top: calc(18px * var(--scale-global));
        font-size: calc(100px * var(--scale-global) * var(--scale-header));
        line-height: 1.04;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .price {
        margin-top: calc(24px * var(--scale-global));
        display: inline-block;
        padding: calc(22px * var(--scale-global)) calc(36px * var(--scale-global));
        border-radius: 999px;
        border: 2px solid rgba(200, 162, 74, 0.55);
        color: #fff4cf;
        font-size: calc(64px * var(--scale-global) * var(--scale-text));
        font-weight: 900;
        background: rgba(0, 0, 0, 0.2);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
      }
      .features-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: center;
        gap: calc(20px * var(--scale-global));
        margin-top: calc(40px * var(--scale-global));
        margin-bottom: auto;
      }
      .chip {
        padding: calc(16px * var(--scale-global)) calc(24px * var(--scale-global));
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(200, 162, 74, 0.28);
        color: #f8f4e8;
        font-size: calc(32px * var(--scale-global) * var(--scale-text));
        font-weight: 700;
      }
      .footer {
        background: #050d1c;
        border-top: 2px solid #d4af37;
        text-align: center;
        padding: calc(26px * var(--scale-global)) calc(60px * var(--scale-global)) calc(34px * var(--scale-global));
        font-size: calc(28px * var(--scale-global) * var(--scale-footer));
        line-height: 1.5;
        font-weight: 700;
        letter-spacing: 0.02em;
        z-index: 2;
      }
      .subtle-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 110px 110px;
        opacity: 0.22;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="subtle-grid"></div>
      {% if logo_data_uri %}
      <img class="watermark" src="{{ logo_data_uri }}" alt="Goel Estates watermark" />
      {% endif %}

      <div class="header">
        {% if logo_data_uri %}
        <img class="brand-logo" src="{{ logo_data_uri }}" alt="Goel Estates logo" />
        {% endif %}
      </div>

      <div class="content">
        <div class="property-type">{{ property_type }}</div>
        <div class="headline">{{ location }}</div>
        <div class="price">{{ price }}</div>
        <div class="features-grid">
          {% for feature in features %}
          <div class="chip">{{ feature }}</div>
          {% endfor %}
        </div>
      </div>

      <div class="footer">{{ contact_line }}</div>
    </div>
  </body>
</html>
