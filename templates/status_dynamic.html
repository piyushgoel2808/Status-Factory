<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goel Estates Status Dynamic</title>
    <style>
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }
      .canvas {
        position: relative;
        width: 1080px;
        height: 1920px;
        color: #f7f1df;
        background: #071a33;
      }
      .bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(1.1) contrast(1.04);
      }
      .overlay {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(2, 7, 15, 0.2) 0%, rgba(2, 7, 15, 0.72) 58%, rgba(2, 7, 15, 0.92) 100%),
          linear-gradient(120deg, rgba(7, 26, 51, 0.36) 0%, rgba(7, 26, 51, 0.18) 48%, rgba(200, 162, 74, 0.12) 100%);
      }
      .brand-logo {
        width: 160px;
        height: 160px;
        object-fit: contain;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.24);
      }
      .top {
        position: absolute;
        left: 0;
        right: 0;
        top: 86px;
        text-align: center;
      }
      .eyebrow {
        margin-top: 18px;
        font-size: 20px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #c8a24a;
        font-weight: 700;
      }
      .main {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 460px;
      }
      .property-type {
        font-size: 44px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c8a24a;
        font-weight: 800;
      }
      .headline {
        margin-top: 18px;
        font-size: 86px;
        line-height: 1.04;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .price {
        margin-top: 24px;
        display: inline-block;
        padding: 18px 30px;
        border-radius: 999px;
        border: 2px solid rgba(200, 162, 74, 0.55);
        color: #fff4cf;
        font-size: 46px;
        font-weight: 800;
        background: rgba(0, 0, 0, 0.16);
      }
      .features {
        margin-top: 36px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .chip {
        padding: 18px 24px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(200, 162, 74, 0.28);
        color: #f8f4e8;
        font-size: 28px;
        font-weight: 700;
      }
      .location-card {
        margin-top: 40px;
        padding: 26px 30px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .location-label {
        font-size: 18px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(248, 241, 225, 0.65);
        font-weight: 700;
      }
      .location-value {
        margin-top: 10px;
        font-size: 34px;
        line-height: 1.12;
        font-weight: 800;
      }
      .footer {
        position: absolute;
        left: 56px;
        right: 56px;
        bottom: 58px;
        padding: 22px 26px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.24);
        border: 1px solid rgba(200, 162, 74, 0.22);
        text-align: center;
        font-size: 24px;
        line-height: 1.5;
        font-weight: 700;
      }
      .source-tag {
        position: absolute;
        right: 72px;
        top: 66px;
        padding: 12px 18px;
        border-radius: 999px;
        background: rgba(7, 26, 51, 0.55);
        border: 1px solid rgba(200, 162, 74, 0.22);
        color: rgba(247, 241, 223, 0.82);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      {% if background_url %}
      <img class="bg-image" src="{{ background_url }}" alt="Dynamic property background" />
      {% endif %}
      <div class="overlay"></div>
      <div class="source-tag">{{ background_source|default('background') }}</div>
      <div class="top">
        {% if logo_data_uri %}
        <img class="brand-logo" src="{{ logo_data_uri }}" alt="Goel Estates logo" />
        {% endif %}
        <div class="eyebrow">Goel Estates</div>
      </div>

      <div class="main">
        <div class="property-type">{{ property_type }}</div>
        <div class="headline">{{ location }}</div>
        <div class="price">{{ price }}</div>
        <div class="features">
          {% for feature in features %}
          <div class="chip">{{ feature }}</div>
          {% endfor %}
        </div>
        <div class="location-card">
          <div class="location-label">Key features</div>
          <div class="location-value">{{ features_summary }}</div>
        </div>
      </div>

      <div class="footer">{{ contact_line }}</div>
    </div>
  </body>
</html>
