[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "status-factory"
version = "0.1.0"
description = "Goel Estates WhatsApp Status generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "playwright>=1.46",
  "python-multipart>=0.0.9",
  "requests>=2.32",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]
